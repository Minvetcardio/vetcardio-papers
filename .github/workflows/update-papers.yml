name: Update PubMed papers

on:
  workflow_dispatch:
  push:
    paths:
      - "fetch_papers.py"
      - ".github/workflows/update-papers.yml"
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: update-pubmed-papers
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Collect PubMed papers with retry
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3; do
            echo "PubMed collection attempt ${attempt}/3"

            if python fetch_papers.py; then
              echo "PubMed collection succeeded."
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 60))
              echo "Attempt failed. Retrying in ${wait_seconds} seconds..."
              sleep "${wait_seconds}"
            fi
          done

          echo "PubMed collection failed after 3 attempts."
          exit 1

      - name: Save updated papers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json

          if git diff --cached --quiet; then
            echo "No paper changes to commit."
            exit 0
          fi

          git commit -m "Update PubMed papers"
          git push
